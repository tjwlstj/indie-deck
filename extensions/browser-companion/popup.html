<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IndieDeck Browser Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1 data-i18n="heading">IndieDeck 상품 연결</h1>
    <p class="intro" data-i18n="intro"></p>
    <section id="autoPanelSettings" class="auto-panel-settings" aria-label="Automatic product panels">
      <h2 id="autoPanelHeading">자동 상품 패널</h2>
      <p id="autoPanelStatus" role="status" aria-live="polite"></p>
      <div class="panel-setting-actions">
        <button id="enableAutoPanel" type="button" disabled></button>
        <button id="hideAutoPanel" type="button" disabled></button>
        <button id="disableAutoPanel" type="button" disabled></button>
        <button id="disableAllAutoPanels" type="button" disabled></button>
      </div>
      <p id="autoPanelScope" class="instructions"></p>
      <p id="autoPanelRefresh" class="instructions"></p>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="preview" hidden aria-label="Product information">
      <dl>
        <dt data-i18n="provider"></dt><dd id="provider"></dd>
        <dt data-i18n="product"></dt><dd><code id="productId"></code></dd>
      </dl>
      <label for="productTitle" data-i18n="title"></label>
      <input id="productTitle" type="text" maxlength="240" autocomplete="off">
      <p class="page-label" data-i18n="page"></p>
      <a id="productPage" target="_blank" rel="noopener noreferrer"></a>
      <section class="artwork-controls" aria-label="Product artwork">
        <button id="findArtwork" type="button" disabled data-i18n="findArtwork"></button>
        <p id="artworkStatus" role="status" aria-live="polite" data-i18n="artworkHint"></p>
        <label for="artworkChoice" data-i18n="artworkChoice"></label>
        <select id="artworkChoice" disabled></select>
        <label class="checkbox-label"><input id="includeArtwork" type="checkbox" disabled><span data-i18n="includeArtwork"></span></label>
      </section>
      <button id="copyLink" type="button" disabled data-i18n="copy"></button>
      <button id="saveLink" type="button" disabled data-i18n="export"></button>
      <p class="instructions" data-i18n="instructions"></p>
    </section>
    <p class="privacy" data-i18n="privacy"></p>
    <p class="scope" data-i18n="scope"></p>
    <button id="reloadCompanion" class="reload-companion" type="button" disabled>확장 업데이트 적용 / 새로고침</button>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
