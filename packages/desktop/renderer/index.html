<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';"
    />
    <title>IndieDeck</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      Every user-visible string carries data-i18n (text) or data-i18n-attr
      (attribute), so applyStaticTranslations() in app.js can re-render the whole
      chrome after a language switch without touching this file again.
    -->
    <header class="topbar">
      <div class="brand">
        <span class="mark">▚</span>
        <span>IndieDeck</span>
        <span id="appVersion" class="version" hidden></span>
      </div>

      <div class="search">
        <input
          id="search"
          type="search"
          data-i18n-attr="placeholder:ui.app.search"
          placeholder="Search games…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div class="topbar-actions">
        <!-- Transient task indicator, not a permanent control (§4.1). -->
        <span id="taskStatus" class="task-status" hidden></span>
        <button id="scan" class="ghost" data-i18n-attr="title:ui.app.refreshTitle" title="Rescan library roots">
          <span data-i18n="ui.app.refresh">Refresh</span>
        </button>
        <button id="openSettings" class="ghost" data-i18n="ui.app.settings">Settings</button>
      </div>
    </header>

    <main class="shell" id="libraryView">
      <nav class="sidebar">
        <div class="sidebar-section">
          <h2 data-i18n="ui.sidebar.engines">Engines</h2>
          <ul id="engineFilters" class="filters"></ul>
        </div>
        <div class="sidebar-section">
          <h2 data-i18n="ui.sidebar.status">Status</h2>
          <ul id="statusFilters" class="filters">
            <li><button data-status="all" class="active" data-i18n="ui.sidebar.allGames">All games</button></li>
            <li><button data-status="untranslated" data-i18n="ui.sidebar.untranslated">No translator</button></li>
            <li><button data-status="translated" data-i18n="ui.sidebar.translated">Has translator</button></li>
            <li>
              <button data-status="issues">
                <span data-i18n="ui.sidebar.issues">Needs attention</span>
                <span id="issueCount" class="pill warn">0</span>
              </button>
            </li>
          </ul>
        </div>
      </nav>

      <section class="list">
        <div id="gameList" class="game-list"></div>
      </section>

      <section id="detail" class="detail"></section>
    </main>

    <!-- Settings lives in this same document; switching views never navigates. -->
    <main id="settingsView" class="settings" hidden>
      <header class="settings-head">
        <button id="closeSettings" class="ghost" data-i18n="ui.settings.back">← Back to library</button>
        <h1 data-i18n="ui.settings.title">Settings</h1>
      </header>

      <div class="settings-body">
        <section class="settings-section">
          <h2 data-i18n="ui.settings.general">General</h2>
          <div class="settings-row">
            <label for="uiLocale"><span data-i18n="ui.app.language">Language</span></label>
            <select id="uiLocale"></select>
          </div>
          <div class="settings-row about">
            <label><span data-i18n="ui.settings.about">About</span></label>
            <span id="aboutInfo" class="about-info"></span>
          </div>
        </section>

        <section class="settings-section">
          <h2 data-i18n="ui.settings.translationDefaults">Translation defaults</h2>
          <p class="settings-hint" data-i18n="ui.settings.defaultsHint">
            Applied to newly computed plans after you press save.
          </p>
          <div class="settings-row">
            <label for="targetLanguage"><span data-i18n="ui.settings.targetLang">Translate into</span></label>
            <select id="targetLanguage">
              <option value="ko">한국어</option>
              <option value="en">English</option>
              <option value="ja">日本語</option>
              <option value="zh">中文</option>
            </select>
          </div>
          <div class="settings-row">
            <label for="sourceLanguage"><span data-i18n="ui.settings.sourceLang">Translate from</span></label>
            <select id="sourceLanguage">
              <option value="ja">日本語</option>
              <option value="en">English</option>
              <option value="zh">中文</option>
              <option value="ko">한국어</option>
            </select>
          </div>
          <div class="settings-row">
            <label for="endpoint"><span data-i18n="ui.settings.endpoint">Translation engine</span></label>
            <select id="endpoint" data-i18n-attr="title:ui.app.endpointTitle" title="Translation engine"></select>
          </div>
          <div class="settings-save">
            <button id="saveDefaults" class="primary" data-i18n="ui.settings.save">Save</button>
            <span id="defaultsSaved" class="save-state" role="status"></span>
          </div>
        </section>

        <section class="settings-section">
          <h2 data-i18n="ui.settings.library">Library</h2>
          <ul id="rootList" class="roots-list settings-roots"></ul>
          <div class="settings-row actions-inline">
            <button id="addRoot" class="ghost" data-i18n="ui.app.addFolder">Add folder</button>
            <button id="rescanRoots" class="ghost" data-i18n="ui.settings.rescan">Full rescan</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="statusbar">
      <span id="status" data-i18n="ui.app.loading">Loading library…</span>
      <span id="counts" class="muted"></span>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
