<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';"
    />
    <title>IndieDeck</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      Every user-visible string carries data-i18n (text) or data-i18n-attr
      (attribute), so applyStaticTranslations() in app.js can re-render the whole
      chrome after a language switch without touching this file again.
    -->
    <header class="topbar">
      <div class="brand">
        <span class="mark">▚</span>
        <span>IndieDeck</span>
      </div>

      <div class="search">
        <input
          id="search"
          type="search"
          data-i18n-attr="placeholder:ui.app.search"
          placeholder="Search games…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div class="topbar-actions">
        <label class="lang">
          <span data-i18n="ui.app.to">to</span>
          <select id="targetLanguage">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
          </select>
        </label>
        <label class="lang">
          <span data-i18n="ui.app.from">from</span>
          <select id="sourceLanguage">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
          </select>
        </label>
        <select id="endpoint" class="endpoint" data-i18n-attr="title:ui.app.endpointTitle" title="Translation engine"></select>
        <select id="uiLocale" class="locale" data-i18n-attr="title:ui.app.language" title="Language"></select>
        <button id="addRoot" class="ghost" data-i18n="ui.app.addFolder">Add folder</button>
        <button id="scan" class="primary" data-i18n="ui.app.scan">Scan</button>
      </div>
    </header>

    <main class="shell">
      <nav class="sidebar">
        <div class="sidebar-section">
          <h2 data-i18n="ui.sidebar.engines">Engines</h2>
          <ul id="engineFilters" class="filters"></ul>
        </div>
        <div class="sidebar-section">
          <h2 data-i18n="ui.sidebar.status">Status</h2>
          <ul id="statusFilters" class="filters">
            <li><button data-status="all" class="active" data-i18n="ui.sidebar.allGames">All games</button></li>
            <li><button data-status="untranslated" data-i18n="ui.sidebar.untranslated">No translator</button></li>
            <li><button data-status="translated" data-i18n="ui.sidebar.translated">Has translator</button></li>
            <li>
              <button data-status="issues">
                <span data-i18n="ui.sidebar.issues">Needs attention</span>
                <span id="issueCount" class="pill warn">0</span>
              </button>
            </li>
          </ul>
        </div>
        <div class="sidebar-section roots">
          <h2 data-i18n="ui.sidebar.roots">Roots</h2>
          <ul id="rootList" class="roots-list"></ul>
        </div>
      </nav>

      <section class="list">
        <div id="gameList" class="game-list"></div>
      </section>

      <section id="detail" class="detail"></section>
    </main>

    <footer class="statusbar">
      <span id="status" data-i18n="ui.app.loading">Loading library…</span>
      <span id="counts" class="muted"></span>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
