name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches upstream releases that make the pinned registry stale.
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Registry self-check
        run: node packages/cli/dist/index.js registry check

      # Boots the Electron window against an empty library and checks the
      # renderer actually painted. A renderer that throws on load would pass
      # every unit test otherwise.
      - name: Desktop smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          INDIEDECK_SMOKE: '1'
          INDIEDECK_HOME: ${{ runner.temp }}/indiedeck-ci
        run: xvfb-run --auto-servernum npx electron packages/desktop

      - name: Desktop smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          INDIEDECK_SMOKE: '1'
          INDIEDECK_HOME: ${{ runner.temp }}/indiedeck-ci
        run: npx electron packages/desktop

  registry-freshness:
    # Advisory only: an upstream release does not break the build, it just means
    # the pinned version table needs a refresh.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run build
      - name: Compare pinned versions against upstream releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node packages/cli/dist/index.js registry check --online
