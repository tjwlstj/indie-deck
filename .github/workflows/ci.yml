name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catches upstream releases that make the pinned registry stale.
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Ensure pinned Electron binary
        run: node scripts/ensure-electron.mjs
      - name: Audit development and runtime dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm test
      - name: Registry self-check
        run: node packages/cli/dist/index.js registry check

      # Keep Chromium's production sandbox enabled in hosted Linux runners.
      # Electron ships this helper without the privileged ownership/mode that
      # Chromium requires, so configure it explicitly before the smoke boot.
      - name: Configure Electron sandbox helper (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          electron_dir="$(node -p "require('path').dirname(require.resolve('electron'))")"
          node "$electron_dir/install.js"
          sandbox_path="$electron_dir/dist/chrome-sandbox"
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"
          test "$(stat -c '%U:%G %a' "$sandbox_path")" = "root:root 4755"

      # Boots the Electron window against an empty library and checks the
      # renderer actually painted. A renderer that throws on load would pass
      # every unit test otherwise.
      - name: Desktop smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          INDIEDECK_SMOKE: '1'
          INDIEDECK_HOME: ${{ runner.temp }}/indiedeck-ci
        run: xvfb-run --auto-servernum npx electron packages/desktop

      - name: Desktop smoke test (Windows)
        if: runner.os == 'Windows'
        env:
          INDIEDECK_SMOKE: '1'
          INDIEDECK_HOME: ${{ runner.temp }}/indiedeck-ci
        run: npx electron packages/desktop

      - name: Build Windows distributions for startup and installer checks
        if: runner.os == 'Windows' && matrix.node == '24.x'
        run: node scripts/build-ci-win.mjs

      - name: Inspect installer wizard readability
        if: runner.os == 'Windows' && matrix.node == '24.x'
        env:
          INDIEDECK_INSTALLER_READABILITY_CI: '1'
        run: node scripts/check-installer-readability.mjs

      - name: Save installer readability evidence
        if: always() && runner.os == 'Windows' && matrix.node == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: installer-readability
          path: out/installer-readability/
          retention-days: 1
          if-no-files-found: ignore

      - name: Verify packaged fullscreen startup
        if: runner.os == 'Windows' && matrix.node == '24.x'
        env:
          INDIEDECK_GAMING_STARTUP_CI: '1'
        run: node scripts/check-gaming-startup.mjs

      - name: Verify unpacked runtime hashes
        if: runner.os == 'Windows' && matrix.node == '24.x'
        run: node scripts/check-package.mjs --runtime-only

      - name: Offline Korean and English desktop flows
        if: runner.os == 'Windows' && matrix.node == '24.x'
        run: npm run desktop:flow

      - name: Save packaged gaming startup evidence
        if: always() && runner.os == 'Windows' && matrix.node == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: packaged-gaming-startup
          path: out/gaming-packaged-startup/
          retention-days: 1
          if-no-files-found: ignore

      - name: Save synthetic desktop screenshots
        if: runner.os == 'Windows' && matrix.node == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-screenshots
          path: |
            out/desktop-flow-ko.png
            out/desktop-flow-en.png
            out/desktop-thumbnail-ko.png
            out/desktop-thumbnail-en.png
            out/desktop-store-artwork-ko.png
            out/desktop-store-artwork-en.png
            out/desktop-library-classification-ko.png
            out/desktop-library-classification-en.png
            out/desktop-stores-ko.png
            out/desktop-stores-en.png
            out/desktop-gaming-ko.png
            out/desktop-gaming-en.png
          retention-days: 1
          if-no-files-found: error

      - name: Comparison history across app restarts
        if: runner.os == 'Windows' && matrix.node == '24.x'
        run: npm run desktop:history

      - name: Prepare isolated Chromium extension tests
        if: runner.os == 'Linux' && matrix.node == '24.x'
        shell: bash
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          browser_dir="$(node --input-type=module -e "import { chromium } from 'playwright-core'; import path from 'node:path'; console.log(path.dirname(chromium.executablePath()));")"
          sandbox_path="$browser_dir/chrome-sandbox"
          if [ ! -f "$sandbox_path" ]; then sandbox_path="$browser_dir/chrome_sandbox"; fi
          test -f "$sandbox_path"
          sudo chown root:root "$sandbox_path"
          sudo chmod 4755 "$sandbox_path"

          # Ubuntu restricts downloaded developer builds' user namespaces.
          # Allow only this CI browser binary, keeping the Chromium sandbox on
          # and leaving the host's global AppArmor/sysctl policy intact.
          # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
          test -x "$browser_dir/chrome"
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            "profile indiedeck-ci-chromium \"$browser_dir/chrome\" flags=(unconfined) {" \
            '  userns,' '}' | sudo tee /etc/apparmor.d/indiedeck-ci-chromium > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/indiedeck-ci-chromium

      - name: Real Chromium automatic-panel integration
        if: runner.os == 'Linux' && matrix.node == '24.x'
        env:
          INDIEDECK_BROWSER_PANEL_CI: '1'
        run: node scripts/check-browser-panel.mjs

      - name: Save browser panel evidence
        if: always() && runner.os == 'Linux' && matrix.node == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: browser-panel
          path: out/browser-panel/
          retention-days: 1
          if-no-files-found: ignore

  registry-freshness:
    # Advisory only: an upstream release does not break the build, it just means
    # the pinned version table needs a refresh.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run build
      - name: Compare pinned versions against upstream releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node packages/cli/dist/index.js registry check --online
